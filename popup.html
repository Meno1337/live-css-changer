<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

<style>

body {
  width: 400px;
  padding: 10px;
  background: #f4f4f4;
  font-family: sans-serif;
  box-sizing: border-box;
}

#editor-container {
  height: 180px;
  border: 1px solid #ccc;
}

.CodeMirror {
  height: 100% !important;
}

.btns {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

button {
  flex: 1;
  padding: 10px;
  cursor: pointer;
  border: none;
  border-radius: 4px;
  font-weight: bold;
  color: white;
}

#apply-btn { background: #007bff; }
#reset-btn { background: #6c757d; }

#presets{
margin-top:10px;
display:flex;
flex-direction:column;
gap:6px;
}

#presets button{
padding:6px;
cursor:pointer;
border:1px solid #ccc;
background:#fff;
border-radius:4px;
color:black;
}

#example-text{
margin-top:6px;
font-size:12px;
color:#555;
}

</style>


<!-- CodeMirror -->

<link rel="stylesheet" href="codemirror-5.65.21/lib/codemirror.css">
<link rel="stylesheet" href="codemirror-5.65.21/addon/hint/show-hint.css">

<script src="codemirror-5.65.21/lib/codemirror.js"></script>
<script src="codemirror-5.65.21/mode/css/css.js"></script>

<script src="codemirror-5.65.21/addon/hint/show-hint.js"></script>
<script src="codemirror-5.65.21/addon/hint/css-hint.js"></script>

</head>



<body>

<h3>Live CSS Editor</h3>

<div id="editor-container"></div>

<div id="example-text">
Пример: <code>* { background-color: red; }</code>
</div>


<div id="presets">

<h4>Пресеты</h4>

<button id="preset-bg">Изменить цвет фона</button>

<button id="preset-fontsize">Размер шрифта всей страницы</button>

<button id="preset-fontfamily">Название шрифта</button>

</div>


<div class="btns">

<button id="apply-btn">ПРИМЕНИТЬ</button>

<button id="reset-btn">СБРОСИТЬ</button>

</div>


<script src="popup.js"></script>

</body>

</html>
